name: ci

on:
  push:
  pull_request:

jobs:
  quick-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai anthropic pandas plotly streamlit

      - name: Run quick tests
        run: bash scripts/run_all_tests.sh

      - name: Block pycache artifacts
        run: |
          if git ls-files | grep -E '(__pycache__/|\.pyc$)'; then
            echo "Found tracked pycache/pyc artifacts. Please remove them."
            exit 1
          fi

